name: Playwright tests
# Run on changes and allow a manual run from the Actions tab.
on: [push, pull_request, workflow_dispatch]
# These checks only need to read repository contents; no write token is necessary.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Use the committed lockfile so CI installs the same dependency versions.
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm test
      # Upload the report even when a test fails; failure evidence is the most useful report.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
